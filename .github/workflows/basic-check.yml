name: Basic Check

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

# A newer revision supersedes validation/artifacts for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  file-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm plugin file exists
        run: test -f wordpress/sustainable-catalyst-research-librarian/sustainable-catalyst-research-librarian.php
      - name: Confirm assets exist
        run: |
          test -f wordpress/sustainable-catalyst-research-librarian/assets/research-librarian.css
          test -f wordpress/sustainable-catalyst-research-librarian/assets/research-librarian.js
